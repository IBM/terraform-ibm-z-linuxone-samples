---
- name: TFE - Create Initial Admin User
  hosts: tfe
  become: true

  vars_files:
    - ../vars/secrets.yml

  tasks:

    # ======================================================
    # Verify TFE is ready before attempting user creation
    # ======================================================

    - name: Verify TFE is running
      ansible.builtin.command:
        cmd: podman exec {{ tfe_container_name }} tfectl app health readiness
      register: readiness_check
      changed_when: false
      failed_when: readiness_check.rc != 0

    # ======================================================
    # Retrieve the IACT (Initial Admin Creation Token)
    # This token is generated once by TFE on first boot and
    # is required to call the initial-admin-user API endpoint.
    # ======================================================

    - name: Retrieve IACT token
      ansible.builtin.command:
        cmd: podman exec {{ tfe_container_name }} tfectl admin token
      register: tfe_iact_token
      changed_when: false
      failed_when: tfe_iact_token.rc != 0
      no_log: true

    - name: Fail if IACT token is empty
      ansible.builtin.fail:
        msg: >
          IACT token is empty. The initial admin user may already have been
          created, or TFE has not fully initialized yet. Verify with:
          podman exec {{ tfe_container_name }} tfectl admin token
      when: tfe_iact_token.stdout | trim == ""

    # ======================================================
    # Create the initial admin user via the IACT API.
    # The token from tfectl admin token is passed as a query
    # parameter to authenticate the one-time setup endpoint.
    # 401 + "admin user creation not allowed" means the admin
    # user already exists — treated as success, not a failure.
    # ======================================================

    - name: Create TFE initial admin user
      ansible.builtin.uri:
        url: "https://{{ tfe_hostname }}/admin/initial-admin-user?token={{ tfe_iact_token.stdout | trim }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ tfe_admin_username }}"
          email: "{{ tfe_admin_email }}"
          password: "{{ tfe_admin_password }}"
        validate_certs: false
        status_code: [200, 401]
      register: tfe_admin_creation
      no_log: true

    - name: Set admin already exists fact
      ansible.builtin.set_fact:
        tfe_admin_already_exists: >-
          {{ tfe_admin_creation.status == 401 and
             'admin user creation not allowed' in (tfe_admin_creation.json.error | default('')) }}

    # ======================================================
    # Display result — new token or already-exists message
    # ======================================================

    - name: Admin user already exists
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Admin user already exists — skipping creation"
          - "=============================================="
          - "Username : {{ tfe_admin_username }}"
          - "URL      : https://{{ tfe_hostname }}/"
          - "Log in with your existing credentials."
          - "=============================================="
      when: tfe_admin_already_exists

    - name: Display admin user creation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "TFE INITIAL ADMIN USER CREATED"
          - "=============================================="
          - "Username : {{ tfe_admin_username }}"
          - "Email    : {{ tfe_admin_email }}"
          - "Token    : {{ tfe_admin_creation.json.token | default('(no token in response)') }}"
          - "URL      : https://{{ tfe_hostname }}/"
          - "=============================================="
          - "Use this token to bootstrap organizations,"
          - "workspaces, and teams via the TFE API or UI."
          - "Save this token — it will not be shown again."
          - "=============================================="
      when: not tfe_admin_already_exists
